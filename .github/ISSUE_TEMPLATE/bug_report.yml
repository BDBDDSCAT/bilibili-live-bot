name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传 Cookie、UID、真实昵称、头像、房间流水、config.json 或 state 目录。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v0.1.0 或 commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options: [macOS, Linux, Docker, Windows, 其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用脱敏或合成数据描述。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已移除 Cookie、UID、昵称、头像、房间号及其他可识别信息。
          required: true
